<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kampüs Etkinlikleri - Etkinlik Ekle</title>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="etkinlikler.html">Etkinlikler</a> |
            <a href="etkinlik-detay1.html">Detay1</a> |
            <a href="etkinlik-detay2.html">Detay2</a> |
            <a href="etkinlik-ekle.html">Ekle</a> |
            <a href="etkinlik-guncelle.html">Güncelle</a> |
        </nav>
    </header>

    <main>
        <h2>Etkinlik Ekle</h2>
        <form action="#" method="get">
            <div>
                <label for="etkinlikAdi">Etkinlik Adı:</label>
                <br>
                <input type="text" id="etkinlikAdi" name="etkinlikAdi" required>
            </div>
            <br>
            
            <div>
                <label for="kategori">Kategori:</label>
                <br>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konser">Konser</option>
                </select>
            </div>
            <br>

            <div>
                <label for="tarih">Tarih:</label>
                <br>
                <input type="date" id="tarih" name="tarih" required>
            </div>
            <br>

            <div>
                <label for="saat">Saat:</label>
                <br>
                <input type="time" id="saat" name="saat" required>
            </div>
            <br>

            <div>
                <label for="yer">Yer:</label>
                <br>
                <input type="text" id="yer" name="yer" required>
            </div>
            <br>

            <div>
                <label for="aciklama">Açıklama:</label>
                <br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="30" required></textarea>
            </div>
            <br>

            <div>
                <label for="kontenjan">Kontenjan:</label>
                <br>
                <input type="number" id="kontenjan" name="kontenjan" required>
            </div>
            <br>

            <button type="submit">Kaydet</button>
        </form>
    </main>

    <footer>
        <p>Ad Soyad 20xxxxxxx 2026</p>
    </footer>
</body>
</html>
