<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501057.css">
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>
    <main>
        <div id="form-wrapper">
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 1.5rem;">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>
            
            <div id="form-message"></div>

            <!-- novalidate: HTML'in varsayılan pop-up hata balonlarını kapatır, bizim kırmızı JS kontrolümüzü açar -->
            <form id="event-form" novalidate>
                <div class="form-grup">
                    <label for="etkinlikAdi">Etkinlik Adı *</label>
                    <input type="text" id="etkinlikAdi" name="title" required minlength="3">
                    <span class="error-msg">Etkinlik adı en az 3 karakter olmalı.</span>
                </div>
                
                <div class="form-grup">
                    <label for="kategori">Kategori *</label>
                    <select id="kategori" name="category" required>
                        <option value="" disabled selected>Seçiniz</option>
                        <option value="seminer">Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="konser">Konser</option>
                    </select>
                    <span class="error-msg">Bir kategori seçin.</span>
                </div>

                <div class="form-grup">
                    <label for="tarih">Tarih *</label>
                    <input type="date" id="tarih" name="date" required>
                    <span class="error-msg">Tarih seçin.</span>
                </div>

                <div class="form-grup">
                    <label for="saat">Saat *</label>
                    <input type="time" id="saat" name="time" required>
                    <span class="error-msg">Saat seçin.</span>
                </div>

                <div class="form-grup">
                    <label for="yer">Yer *</label>
                    <input type="text" id="yer" name="location" required>
                    <span class="error-msg">Yer bilgisini yazın.</span>
                </div>

                <div class="form-grup">
                    <label for="kontenjan">Kontenjan</label>
                    <input type="number" id="kontenjan" name="quota">
                </div>

                <div class="form-grup">
                    <label for="aciklama">Açıklama</label>
                    <textarea id="aciklama" name="description" rows="4"></textarea>
                </div>

                <button type="submit">Kaydet</button>
            </form>
        </div>
    </main>
    <footer>
        <p>AD SOYAD: Davut Sarıkaya ÖğrenciNo: 2416501057 2026</p>
    </footer>
    <script type="module" src="js/event-form.js"></script>
</body>
</html>
